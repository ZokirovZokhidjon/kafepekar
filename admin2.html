<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ 2 — Менюни Бошқариш</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --gold-dim: rgba(197, 160, 89, 0.35); --dark-bg: #120d0a; --panel-bg: rgba(27, 20, 16, 0.92); --text-light: #f4efe6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--dark-bg); color: var(--text-light); font-family: 'Montserrat', sans-serif; min-height: 100vh; position: relative; overflow-x: hidden; }

        .admin-bg-slider { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; }
        .admin-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .admin-slide.active { opacity: 1; }
        .admin-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 13, 10, 0.85); z-index: -1; }

        .wrapper-padding { padding: 30px 20px; position: relative; z-index: 2; }
        .login-wrapper { max-width: 420px; margin: 12vh auto; background: var(--panel-bg); border: 2px solid var(--gold); padding: 40px 30px; text-align: center; }
        .login-wrapper h2 { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 10px; }
        .login-wrapper p { font-size: 13px; color: #aaa; margin-bottom: 25px; }
        .login-wrapper input { width: 100%; padding: 14px; background: var(--dark-bg); border: 1px solid var(--gold-dim); color: #fff; font-size: 16px; text-align: center; margin-bottom: 18px; font-family: inherit; }
        .btn-gold { width: 100%; padding: 14px; background: var(--gold); color: #120d0a; border: none; font-weight: 600; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; }
        
        .container { display: none; max-width: 800px; margin: 0 auto; background: var(--panel-bg); border: 2px solid var(--gold); padding: 30px; }
        h2 { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input, textarea { background: var(--dark-bg); border: 1px solid rgba(197,160,89,0.4); color: #fff; padding: 12px; font-family: inherit; }
        
        /* Файл юклаш майдони учун махсус стиль */
        .file-upload-label { background: var(--dark-bg); border: 1px dashed var(--gold); color: #ccc; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .file-upload-label:hover { border-color: var(--gold); color: var(--gold); }

        .item-list { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 10px 15px; margin-bottom: 10px; border: 1px solid rgba(197,160,89,0.2); gap: 10px; }
        .item-thumb { width: 50px; height: 50px; object-fit: cover; border: 1px solid var(--gold-dim); }
        .del-btn { background: #e74c3c; color: #fff; border: none; padding: 6px 12px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .del-btn:hover { background: #c0392b; }
        .back-link { display: inline-block; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 13px; }

        #custom-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .popup-content { background: var(--panel-bg); border: 2px solid var(--gold); padding: 30px; max-width: 400px; width: 90%; text-align: center; }
        .popup-icon { font-size: 42px; margin-bottom: 10px; }
        .popup-content h3 { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 10px; font-size: 1.3rem; }
        .popup-content p { font-size: 14px; color: #ccc; margin-bottom: 25px; line-height: 1.5; }
        .popup-buttons { display: flex; gap: 10px; justify-content: center; }
        .popup-btn { background: var(--gold); color: #120d0a; border: none; padding: 10px 22px; font-weight: 600; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .popup-btn-cancel { background: transparent; border: 1px solid #777; color: #aaa; }
    </style>
</head>
<body>
    <div class="admin-bg-slider">
        <div class="admin-slide active" style="background-image: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="admin-slide" style="background-image: url('https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1920&q=80');"></div>
        <div class="admin-slide" style="background-image: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1920&q=80');"></div>
    </div>
    <div class="admin-overlay"></div>

    <div class="wrapper-padding">
        <!-- Кириш ойнаси -->
        <div id="login-screen" class="login-wrapper">
            <h2>Ходим Кабинети</h2>
            <p>Фақат масъул ходимнинг телефон рақами орқали кирилади</p>
            <input type="tel" id="staff-phone" placeholder="+998 50 119 11 46" value="+998 ">
            <button class="btn-gold" onclick="loginStaff()">Кириш</button>
            <a href="index.html" class="back-link">← Сайтга қайтиш</a>
        </div>

        <!-- Меню қўшиш панели -->
        <div id="dashboard-screen" class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h2>Админ 2: Менюни Бошқариш</h2>
                <button class="btn-gold" style="width: auto; padding: 8px 14px; font-size: 12px;" onclick="logoutStaff()">Чиқиш</button>
            </div>
            <p style="font-size:13px; color:#aaa; margin-bottom:20px;">Бу ерда киритилган маҳсулотлар ва расмлар автоматик равишда хўрандалар учун асосий сайтга чиқади.</p>
            
            <div class="form-group">
                <input type="text" id="p-name" placeholder="Маҳсулот номи (масалан: Махсус Торт)">
                <input type="number" id="p-price" placeholder="Нархи (сўмда, масалан: 25000)">
                <textarea id="p-desc" placeholder="Қисқача тавсифи"></textarea>
                
                <!-- Расм файлини юклаш инпути -->
                <label class="file-upload-label" id="file-label">
                    📁 Таом расмини юклаish (Файл танглаш)
                    <input type="file" id="p-file" accept="image/*" style="display: none;" onchange="previewFile()">
                </label>
                
                <button class="btn-gold" onclick="addProduct()">Маҳсулотни Сайтга Қўшиш</button>
            </div>

            <div class="item-list">
                <h3 style="font-family:'Cinzel',serif; color:var(--gold); margin-bottom:15px; font-size:1.1rem;">Ҳозир сайтдаги маҳсулотлар:</h3>
                <div id="admin-products"></div>
            </div>

            <a href="index.html" class="back-link">← Асосий сайтга қайтиш</a>
        </div>
    </div>

    <!-- Тақиқ модали -->
    <div id="custom-popup">
        <div class="popup-content">
            <div id="popup-icon" class="popup-icon">🤖👮‍♂️</div>
            <h3 id="popup-title">Диққат</h3>
            <p id="popup-text">Хабар матни</p>
            <div id="popup-btns" class="popup-buttons">
                <button class="popup-btn" onclick="closePopup()">Тўғри</button>
            </div>
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.admin-slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 4000);

        const STAFF_VALID_PHONE = "+998501191146";
        let uploadedImageBase64 = "";

        let products = JSON.parse(localStorage.getItem('kafe_products')) || [
            { name: "Иссиқ Булочка", price: 8000, desc: "Янги ёпилган, долчин ва майизли юмшоқ ширин булочка.", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80" },
            { name: "Миллий Шўрва", price: 28000, desc: "Мол гўшти, сабзавотлар ва кўкатлар билан тайёрланган иссиқ шўрва.", img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=600&q=80" },
            { name: "Капучино Кофе", price: 18000, desc: "Янги қовурилган Арабика донларидан тайёрланган қаймоқли қаҳва.", img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=600&q=80" },
            { name: "Пастрами Сендвич", price: 35000, desc: "Махсус дудланган гўшт, пишлоқ ва соус билан қовурилган нон.", img: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=600&q=80" }
        ];

        // Файлни ўқиб Base64 форматга ўтказиш (компьютердан расм юклаганда ишлайди)
        function previewFile() {
            const fileInput = document.getElementById('p-file');
            const fileLabel = document.getElementById('file-label');
            const file = fileInput.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    fileLabel.textContent = "✅ Расм танланди: " + file.name;
                };
                reader.readAsDataURL(file);
            }
        }

        function showMessage(icon, title, text, callback = null) {
            document.getElementById('popup-icon').textContent = icon;
            document.getElementById('popup-title').textContent = title;
            document.getElementById('popup-text').textContent = text;
            const btns = document.getElementById('popup-btns');
            
            if (callback) {
                btns.innerHTML = `<button class="popup-btn popup-btn-cancel" onclick="closePopup()">Йўқ</button><button class="popup-btn" id="confirm-ok-btn">Ҳа</button>`;
                document.getElementById('confirm-ok-btn').onclick = function() { closePopup(); callback(); };
            } else {
                btns.innerHTML = `<button class="popup-btn" onclick="closePopup()">Тўғри</button>`;
            }
            document.getElementById('custom-popup').style.display = 'flex';
        }

        function closePopup() { document.getElementById('custom-popup').style.display = 'none'; }

        function loginStaff() {
            let phone = document.getElementById('staff-phone').value.trim().replace(/\s+/g, '');
            if (phone !== STAFF_VALID_PHONE) {
                showMessage("👮‍♂️🤖", "Сизга мумкинмас!", "Бу кабинетга фақат масъул ходим кира олади. Сизнинг рақамингиз рўйхатда йўқ!");
                return;
            }
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            renderAdminProducts();
        }

        function logoutStaff() {
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
        }

        function renderAdminProducts() {
            const list = document.getElementById('admin-products');
            list.innerHTML = '';
            products.forEach((p, index) => {
                list.innerHTML += `
                    <div class="item-row">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <img src="${p.img}" class="item-thumb" alt="расм">
                            <div>
                                <strong>${p.name}</strong> — <span style="color:var(--gold);">${p.price.toLocaleString()} сўм</span>
                            </div>
                        </div>
                        <button class="del-btn" onclick="deleteProduct(${index})">Ўчириш</button>
                    </div>
                `;
            });
            localStorage.setItem('kafe_products', JSON.stringify(products));
        }

        function addProduct() {
            const name = document.getElementById('p-name').value.trim();
            const price = parseFloat(document.getElementById('p-price').value);
            const desc = document.getElementById('p-desc').value.trim() || "Мазали кафе маҳсулоти.";
            
            // Агар расм юкланган бўлса ўшани, юкланмаган бўлса стандарт расмни оламиз
            const img = uploadedImageBase64 || "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80";

            if (!name || isNaN(price)) {
                showMessage("⚠️", "Хатолик", "Маҳсулот номи ва нархини киритинг!");
                return;
            }

            products.push({ name, price, desc, img });
            renderAdminProducts();

            // Формани тозалаш
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-desc').value = '';
            document.getElementById('p-file').value = '';
            document.getElementById('file-label').textContent = "📁 Таом расмини юклаш (Файл танлаш)";
            uploadedImageBase64 = "";

            showMessage("✅", "Муваффақиятли", "Маҳсулот расми билан бирга сайтга қўшилди!");
        }

        function deleteProduct(index) {
            showMessage("🗑", "Тасдиқлаш", "Ушбу маҳсулотни сайтдан ўчирмоқчимисиз?", function() {
                products.splice(index, 1);
                renderAdminProducts();
            });
        }
    </script>
</body>
</html>
